<script>
/* Si el móvil abre la página en modo "sitio de escritorio" (o un visor la pinta a 980 px), la escalamos para que se vea como en móvil. */
(function(){
  function fit(){
    try {
      var de = document.documentElement, sw = Math.min(screen.width, screen.height > screen.width ? screen.width : screen.width);
      var coarse = window.matchMedia && matchMedia('(pointer:coarse)').matches;
      de.style.zoom = '';
      var w = window.innerWidth;
      if (coarse && sw && sw <= 820 && w > sw * 1.3) de.style.zoom = (w / sw).toFixed(3);
    } catch(e){}
  }
  fit(); window.addEventListener('resize', fit); window.addEventListener('orientationchange', function(){ setTimeout(fit, 300); });
})();
</script>
<title>Tailandia 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EDF4F5; --surface:#FFFFFF; --surface2:#E2EDEF; --ink:#12203A; --muted:#4D5F78; --line:#D0DEE2;
  --gold:#E39A12; --goldsoft:#FFF1CF; --goldink:#6B4200; --jade:#13776F; --jadesoft:#D8F0EC;
  --lotus:#B93463; --lotussoft:#FBE3EC; --blue:#2D4A9A; --bluesoft:#E0E7FA; --violet:#6B4FB0; --violetsoft:#ECE6FA;
  --greysoft:#E8ECF1; --shadow:0 1px 2px rgba(18,32,58,.08),0 10px 26px -14px rgba(18,32,58,.32);
  --ring:#13776F;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1325; --surface:#142039; --surface2:#1C2B4B; --ink:#E8EEF8; --muted:#9DB0CC; --line:#27395E;
    --gold:#F4B13E; --goldsoft:#3A2E12; --goldink:#FFD98A; --jade:#4CC9BC; --jadesoft:#10342F;
    --lotus:#F47FA5; --lotussoft:#3D1A2A; --blue:#8FA8F0; --bluesoft:#1B2750; --violet:#B7A0F2; --violetsoft:#2A2250;
    --greysoft:#222F4A; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7); --ring:#4CC9BC;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1325; --surface:#142039; --surface2:#1C2B4B; --ink:#E8EEF8; --muted:#9DB0CC; --line:#27395E;
  --gold:#F4B13E; --goldsoft:#3A2E12; --goldink:#FFD98A; --jade:#4CC9BC; --jadesoft:#10342F;
  --lotus:#F47FA5; --lotussoft:#3D1A2A; --blue:#8FA8F0; --bluesoft:#1B2750; --violet:#B7A0F2; --violetsoft:#2A2250;
  --greysoft:#222F4A; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 26px -14px rgba(0,0,0,.7); --ring:#4CC9BC;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 118px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:40}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}

/* Cabecera */
.top{padding:14px 0 8px}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:600 clamp(1.7rem,7vw,2.4rem)/1.02 "Fraunces",Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:-.02em;font-variation-settings:"SOFT" 100,"WONK" 1}
.sub{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:1.2rem}
.widgets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.w{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px;min-width:0}
.w small{display:block;color:var(--muted);font-size:.76rem;line-height:1.2}
.w b{display:block;font-size:1.15rem;line-height:1.25;white-space:nowrap}
.w.hl{background:var(--goldsoft);border-color:transparent}

/* Navegación fija */
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);padding:8px 0 8px;border-bottom:1px solid var(--line)}
.seg{display:flex;overflow-x:auto;scrollbar-width:none;gap:3px;background:var(--surface2);padding:4px;border-radius:14px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;white-space:nowrap;border:0;background:transparent;border-radius:10px;padding:9px 12px;font-weight:600;font-size:.82rem;cursor:pointer;color:var(--muted);line-height:1.15}
.seg button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-x}
.seg.reorder{outline:2px dashed var(--jade);outline-offset:2px}
.seg button.drag{background:var(--jade);color:#fff;transform:scale(1.08);box-shadow:0 8px 20px -6px rgba(0,0,0,.45);position:relative;z-index:2;transition:transform .12s}
.days{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px 2px 4px;margin-top:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days[hidden]{display:none}
.day{flex:none;scroll-snap-align:center;min-width:62px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 8px 7px;text-align:center;cursor:pointer;position:relative}
.day small{display:block;font-size:.72rem;color:var(--muted);line-height:1.1}
.day b{display:block;font-size:1.25rem;line-height:1.15}
.day i{display:block;width:100%;height:4px;border-radius:2px;margin-top:5px;background:var(--c)}
.day[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-current="true"] small{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.day[aria-current="true"] b{color:var(--bg)}
.day .hoy{position:absolute;top:-6px;right:-4px;background:var(--lotus);color:#fff;border-radius:8px;font-size:.62rem;font-weight:700;padding:1px 5px}
.day .cnt{font-size:.66rem;color:var(--jade);font-weight:700;line-height:1}

/* Héroe ilustrado */
.hero{position:relative;border-radius:22px;overflow:hidden;margin:14px 0 12px;box-shadow:var(--shadow);background:#1B1F4B}
.hero svg{display:block;width:100%;height:250px}
.hero .shade{position:absolute;inset:auto 0 0 0;height:62%;background:linear-gradient(to top,rgba(8,12,30,.86),rgba(8,12,30,0))}
.hero .txt{position:absolute;left:16px;right:16px;bottom:14px;color:#fff}
.hero h2{font:500 clamp(1.5rem,5.8vw,2.2rem)/1.08 "Fraunces",Georgia,serif;margin:0}
.hero p{margin:4px 0 0;font-size:.93rem;color:#E8EEF8;max-width:56ch}
.hero .date{position:absolute;top:12px;left:14px;background:rgba(10,14,36,.55);backdrop-filter:blur(6px);color:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.85rem}
.sleep{display:flex;gap:10px;align-items:center;background:var(--violetsoft);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:.93rem}
.sleep span{font-size:1.3rem}
.twinkle circle{animation:tw 3.2s ease-in-out infinite}
.twinkle circle:nth-child(3n){animation-delay:.9s}.twinkle circle:nth-child(3n+1){animation-delay:1.8s}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}

/* Controles */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;font-weight:600;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sw{margin-left:auto;display:flex;gap:8px}
.sw .chip{font-weight:500}

/* Línea de tiempo */
.tl{list-style:none;margin:0;padding:0;position:relative}
.item{display:grid;grid-template-columns:58px 34px 1fr;column-gap:6px;position:relative;padding-bottom:12px}
.item::before{content:"";position:absolute;left:calc(58px + 6px + 16px);top:34px;bottom:-2px;width:2px;background:repeating-linear-gradient(to bottom,var(--line) 0 6px,transparent 6px 11px)}
.item:last-child::before{display:none}
.tcol{padding-top:7px;text-align:right}
.time{font-weight:700;font-size:.98rem;letter-spacing:-.01em}
.node{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;background:var(--greysoft);z-index:1;margin-top:2px;border:2px solid var(--bg)}
.c-vuelo{background:var(--bluesoft)}.c-trayecto{background:var(--jadesoft)}.c-comida{background:var(--lotussoft)}
.c-visita{background:var(--goldsoft)}.c-hotel{background:var(--violetsoft)}.c-dinero{background:var(--jadesoft)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);min-width:0;margin-left:4px}
.item.opt .card{border-style:dashed;background:color-mix(in srgb,var(--surface) 70%,var(--bg))}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.item.next .card{outline:2px solid var(--gold)}
.head{display:flex;width:100%;gap:10px;align-items:flex-start;text-align:left;background:none;border:0;padding:11px 12px 11px 14px;cursor:pointer;border-radius:16px}
.htxt{flex:1;min-width:0}
.title{display:block;font-weight:700;line-height:1.28}
.sum{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.tag{display:inline-block;margin:2px 0 0;background:var(--goldsoft);color:var(--goldink);border-radius:8px;font-size:.72rem;font-weight:700;padding:1px 8px}
.item.opt .tag{margin-bottom:3px}
.chev{flex:none;width:22px;height:22px;margin-top:3px;position:relative;color:var(--muted)}
.chev::before{content:"";position:absolute;left:5px;top:4px;width:8px;height:8px;border-right:2.5px solid currentColor;border-bottom:2.5px solid currentColor;transform:rotate(45deg);transition:transform .2s}
.open .chev::before{transform:rotate(-135deg);top:8px}
.panel{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .26s ease,visibility 0s .26s}
.open>.panel{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .26s ease,visibility 0s}
.panel>div{overflow:hidden;min-height:0}
.pin{padding:2px 14px 14px;border-top:1px dashed var(--line);margin:0 0}
.pin ul{margin:10px 0 0;padding-left:1.1em}
.pin li{margin:4px 0}
.pin p{margin:10px 0 0}
.warn{margin-top:12px;background:var(--goldsoft);color:var(--ink);border-left:4px solid var(--gold);border-radius:10px;padding:9px 12px;font-size:.92rem}
.routes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.route{display:inline-flex;gap:8px;align-items:center;text-decoration:none;background:var(--jadesoft);color:var(--ink);border:1px solid color-mix(in srgb,var(--jade) 35%,transparent);border-radius:12px;padding:8px 11px;font-size:.88rem;font-weight:600;line-height:1.2}
.route:hover{border-color:var(--jade)}
.route em{font-style:normal;font-size:1.05rem}
.route.place{background:var(--bluesoft);border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.refs{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ref{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:5px 10px;font-size:.84rem;cursor:pointer}
.ref b{font-weight:600;color:var(--muted);margin-right:4px}
.ref span{margin-left:6px;color:var(--jade);font-weight:700}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;font-weight:600;font-size:.88rem;cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:10px;margin:18px 0 40px}
.pager .btn{flex:1;padding:12px}

/* Otras vistas */
.chmap{margin-top:8px}.chtop small{display:block;color:var(--muted);font-size:.82rem;margin:2px 0 8px}.chgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}.chs{border:1px solid var(--line);background:var(--surface2,var(--surface));border-radius:8px;padding:3px 2px;text-align:center;min-height:42px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}.chs b{font-size:.8rem}.chs span{display:flex;flex-wrap:wrap;gap:2px;justify-content:center}.chs i,.chleg i{display:inline-block;width:8px;height:8px;border-radius:50%}.chleg{list-style:none;padding:0;margin:10px 0;display:grid;gap:5px;font-size:.84rem}.chleg li{display:flex;gap:8px;align-items:flex-start}.chleg i{margin-top:6px;flex:none;width:11px;height:11px}.cmp{width:100%;border-collapse:collapse;font-size:.86rem}.cmp td,.cmp th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}@media(max-width:420px){.chgrid{grid-template-columns:repeat(6,1fr)}}
.sec{margin:20px 0 8px;font:500 1.55rem/1.15 "Fraunces",Georgia,serif}
.lead{color:var(--muted);margin:0 0 14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden}
.box .head{padding:12px 14px}
.box .meta{font-size:.8rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:.92rem}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s}
.check{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.check .bx{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;color:transparent;margin-top:1px}
.check[aria-checked="true"] .bx{background:var(--jade);border-color:var(--jade);color:#fff}
.check[aria-checked="true"] .t{text-decoration:line-through;color:var(--muted)}
.check .t b{display:block}.check .t span{color:var(--muted);font-size:.9rem}
.big{font:400 2.6rem/1 "Fraunces",Georgia,serif}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.field{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:130px}
.steps{counter-reset:s;list-style:none;padding:0;margin:10px 0 0}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin:10px 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--muted);margin:6px 0 20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.on{opacity:1;transform:translate(-50%,0)}
.airport svg{width:100%;height:auto;display:block}
footer{padding:10px 0 50px;color:var(--muted);font-size:.85rem}
.ver{display:block;margin-top:8px;font-size:.78rem;opacity:.75}
.hline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hpill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.84rem;color:var(--muted);white-space:nowrap}
.hpill b{color:var(--ink)}.hpill.hl{background:var(--goldsoft);border-color:transparent;color:var(--goldink)}.hpill.hl b{color:var(--goldink)}
details.fold{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'▾';margin-left:auto;color:var(--muted);transition:transform .15s}
details.fold:not([open])>summary::after{transform:rotate(-90deg)}
details.fold>summary small{font-weight:400;color:var(--muted)}
details.fold>.fbody{padding:0 14px 14px}
.gform{background:var(--surface);border:2px solid var(--jade);border-radius:16px;padding:14px;margin:12px 0}
.gform input,.gform select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit;box-sizing:border-box}
.gform .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.seg2{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg2 button{flex:1;border:0;padding:10px;background:var(--surface);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.bigadd{width:100%;padding:14px;font-size:1.05rem;margin-top:12px}
.mtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mtile{border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0;background:var(--surface)}
.mtile small{display:block;color:var(--muted);font-size:.8rem}
.mtile .mv{display:block;font:600 1.7rem/1.1 "Fraunces",Georgia,serif;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .ms{display:block;color:var(--muted);font-size:.82rem;margin-top:2px;white-space:nowrap}

.grow{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.grow .gt{min-width:0;flex:1}.grow .gt small{display:block;color:var(--muted)}
.qhead{display:flex;gap:8px;margin:0 0 12px}
.seg button{padding:9px 9px}.rs .d b{min-width:60px}
@media (max-width:400px){.seg button{padding:9px 7px;font-size:.8rem}}

.wxrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 4px}
.wxb{background:var(--surface2);border-radius:12px;padding:8px 10px;font-size:.88rem;line-height:1.3}
.wxb small{display:block;color:var(--muted);font-size:.74rem}
.wxb b{font-size:1rem}
.tide{margin-top:10px}
.tide svg{width:100%;height:auto;display:block}
.tlist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 0;font-size:.8rem;text-align:center}
.tlist div{background:var(--surface2);border-radius:10px;padding:6px 3px;line-height:1.25}
.tlist small{display:block;color:var(--muted)}
.tlist b{display:block;font-size:.95rem}
.tlist .hi b{color:var(--blue)}.tlist .lo b{color:var(--lotus)}
.meta{font-size:.82rem;color:var(--muted)}
.pin ul.inc{padding-left:0;list-style:none}
.pin ul.inc li{margin:5px 0}
.src{font-size:.8rem;color:var(--muted);margin-top:8px}
/* Sincronización, salud y maleta */
.sync{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-size:.82rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.sync.ok i{background:var(--jade)}.sync.warn i{background:var(--gold)}.sync.off i{background:var(--lotus)}
.sos{background:var(--lotussoft);border:1px solid color-mix(in srgb,var(--lotus) 35%,transparent);border-radius:16px;padding:12px 14px;margin:6px 0 12px}
.sosgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.sosgrid a{display:block;text-decoration:none;background:var(--surface);border-radius:12px;padding:8px 10px;font-size:.82rem;line-height:1.25}
.sosgrid b{display:block;font:400 1.5rem/1.1 "Fraunces",Georgia,serif;color:var(--lotus)}
.segc a{background:var(--bg);border:1px solid var(--line)}.segc b{font-size:1.25rem}
.num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.82rem;flex:none;margin-top:1px}

 { key:'2026-12-03', short:'Jue', num:'3', date:'Jueves 3 de diciembre', title:'Khao Sok, noche en un resort flotante', city:'krabi', scene:'lake', wx:'krabi', wxNote:'Khao Sok está tierra adentro, así que la previsión de Ao Nang es solo orientativa. Las mareas de abajo son las de la costa de Ao Nang.',

    {t:'Día', icon:'🛶', cat:'visita', tide:false, title:'Actividades en Khao Sok', sum:'El horario se concreta en la recepción del resort flotante',
     det:['<ul><li>Olé Tours adjuntó al correo la programación aproximada y un ejemplo de cabaña (el nombre del archivo es “Fan bungalow 1 noche”, así que es la cabaña con ventilador). Los horarios finales se cierran al llegar, porque varían según la ocupación y el clima.</li><li>Según la web de Olé Tours, el día 1 incluye la travesía en barca de cola larga, la comida, tiempo libre para bañarse y un safari en barca al atardecer para ver fauna; el día 2, un safari al amanecer con la niebla sobre el lago, desayuno, tiempo libre y kayak, y de vuelta una parada en el “Guilin de Tailandia” antes de llegar al muelle.</li><li><b>La electricidad (generador) solo funciona de 18:00 a 09:00.</b> De día no hay corriente: el ventilador funciona por la noche.</li><li>No pueden hacer el tour embarazadas, menores de 4 años ni personas con problemas de espalda o de salud. La ruta, las paradas y el orden pueden cambiar por clima, oleaje y mareas.</li></ul>',
          INC(['Noche en cabaña flotante con ventilador','Traslado compartido desde el hotel y vuelta a Ao Nang','Travesía en barca de cola larga','Safari en barca al atardecer y safari de fauna al amanecer','Comidas (el tour de la web incluye comida, cena y desayuno, y una comida picnic al final)','Kayak en las casas flotantes y tiempo libre para bañarse','Entradas al Parque Nacional','Seguro de accidentes'],
              ['Gastos personales'],
              'Fuente: ficha del tour de 2 días desde Krabi en la web de Olé Tours. Esa ficha no menciona bebidas aparte del agua: llevad efectivo por si queréis comprar algo.'),
          '<ul><li><b>Qué llevar:</b> bañador y toalla, gafas de sol, gorra, calzado cómodo, chubasquero, repelente, efectivo, una funda impermeable para el móvil y una foto del pasaporte en el móvil. Una prenda de manga larga por el aire acondicionado del transporte y las tardes en el lago.</li><li>Si la mochila no es impermeable, llevad un chubasquero para taparla: en la barca salpica bastante.</li></ul>'],
     warn:'Para validar el seguro de accidentes hay que dar a Olé Tours el nombre completo, el sexo y el número de pasaporte de los dos; si no, pueden cancelar la reserva. Confirmad que ya lo tienen. Además, el 28 oct seguían esperando la transferencia.',
     links:[{l:'Ficha del tour en Olé Tours',url:'https://www.oletoursamui.com/en/thailand-tours/krabi-tours/khao-sok-overnight-tour-from-krabi',icon:'📄'},{l:'WhatsApp de Olé Tours',url:'https://wa.me/660925792007',icon:'💬'}],
     refs:[['Reserva','612OTS']]},
    {t:'Noche', icon:'🛖', cat:'hotel', title:'Cabaña con ventilador en el resort flotante', sum:'1 noche (el ejemplo de cabaña puede variar ligeramente)',

     det:['<ul><li><b>Reserva #392444585</b>: 2 adultos, 1.700 THB cada uno más 204 THB de comisión (total 3.604 THB).</li><li>Pagado 1.054 THB. <b>Quedan 2.550 THB para pagar al llegar</b>, en efectivo o con tarjeta (la tarjeta lleva un 3% extra; no aceptan American Express).</li><li>Dirección: 305 mu 2, Khao Khram, Tha Pom Klong Song Nam, Krabi. Está a unos 45 min de Ao Nang y es difícil pedir un taxi allí: si vais en Grab o taxi, que el conductor os espere. En moto no hay problema.</li><li>Llevad calcetines, crema solar, gorra y repelente. Ellos dan agua y botas de goma, y paraguas o poncho si llueve.</li><li>Cancelación gratuita hasta 24 horas antes (hasta el sábado 5 dic a las 15:30). Después no hay reembolso. Contacto: +66 81 008 6999 (WhatsApp) o followinggiants.krabi@gmail.com.</li></ul>'],
     warn:'El santuario queda a unos 45 min de Ao Nang. Para llegar a las 15:20, salid del hotel como tarde a las 14:30. Como coméis en Railay, entre el barco de las 13:15 y esa hora solo necesitáis tiempo para cambiaros.',

function stars(n, w, h, seed){
  let s = seed, out = '';
  for (let i = 0; i < n; i++){
    s = (s * 9301 + 49297) % 233280; const x = (s / 233280) * w;
    s = (s * 9301 + 49297) % 233280; const y = (s / 233280) * h;
    s = (s * 9301 + 49297) % 233280; const r = 0.6 + (s / 233280) * 1.3;
    out += '<circle cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="' + r.toFixed(1) + '" fill="#fff" opacity="' + (0.4 + r / 3).toFixed(2) + '"/>';
  }
  return out;
}

function todayKey(){
  try { return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Bangkok', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date()); } catch(e){ return ''; }
}
const fmtNum = n => { try { return n.toLocaleString('es-ES', {useGrouping:'always'}); } catch(e){ return n.toLocaleString('es-ES'); } };
let undoFn = null;
function toast(msg, label, fn){
  const t = $('#toast'); t.textContent = msg; undoFn = fn || null;
  if (label && fn){ const b = document.createElement('button'); b.setAttribute('data-undo', '1'); b.textContent = label; t.appendChild(b); }
  t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), label ? 6000 : 1800);
}
function copyText(txt){
  const ok = () => toast('Copiado: ' + txt);
  try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(txt).then(ok, fallback); return; } } catch(e){}
  fallback();
  function fallback(){
    try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); ok(); }
    catch(e){ toast('No se pudo copiar. Seleccionadlo a mano: ' + txt); }
  }
}

/* ============ Cabecera ============ */
function renderWidgets(){
  const now = new Date();
  const start = new Date('2026-11-26T20:45:00Z'), end = new Date('2026-12-08T00:05:00Z');
  const f = tz => { try { return new Intl.DateTimeFormat('es-ES', {timeZone:tz, hour:'2-digit', minute:'2-digit'}).format(now); } catch(e){ return '--:--'; } };
  let first;
  if (now < start){ const d = Math.ceil((start - now) / 864e5); first = '✈️ Faltan <b>' + d + (d === 1 ? ' día' : ' días') + '</b>'; }
  else if (now <= end){ const i = DAYS.findIndex(x => x.key === todayKey()); first = '📅 Día <b>' + (i >= 0 ? i + 1 : '–') + ' de ' + DAYS.length + '</b>'; }
  else first = '✅ <b>Viaje hecho</b>';
  $('#widgets').innerHTML = '<span class="hpill hl">' + first + '</span><span class="hpill">🇹🇭 <b>' + f('Asia/Bangkok') + '</b></span><span class="hpill">🇪🇸 ' + f('Europe/Madrid') + '</span>';
}

/* Orden de pestañas: se cambia manteniendo pulsada una pestaña y arrastrándola */
function tabKeys(){
  let o = store.get('tabOrder', null);
  if (!Array.isArray(o)) o = [];
  o = o.filter(k => VIEWS[k]);
  Object.keys(VIEWS).forEach(k => { if (o.indexOf(k) < 0) o.push(k); });
  return o;
}
(function(){
  const HOLD = 420, MOVE_TOL = 10;
  let timer = null, startX = 0, startY = 0, btn = null, dragging = false, justDragged = false, scrollRAF = null, lastX = 0;

    dragging = true; btn.classList.add('drag'); seg().classList.add('reorder');

  }

    const s = seg(); if (!dragging || !s) return;
    const r = s.getBoundingClientRect(), edge = 36;

  function moveTo(x){
    const s = seg(); if (!s) return;
    const others = Array.from(s.querySelectorAll('button[data-view]')).filter(b => b !== btn);
    let placed = false;
    for (const b of others){
      const r = b.getBoundingClientRect();
      if (x < r.left + r.width / 2){ if (btn.nextElementSibling !== b) s.insertBefore(btn, b); placed = true; break; }
    }
    if (!placed && s.lastElementChild !== btn) s.appendChild(btn);
  }
  function finish(){

      btn.classList.remove('drag'); seg().classList.remove('reorder');

      toast('Orden de pestañas guardado');
    }
    dragging = false; btn = null;
  }
  function down(x, y, target){
    const b = target && target.closest && target.closest('#seg button[data-view]'); if (!b) return;

  }
  function move(x, y, ev){
    if (!btn) return;
    if (!dragging){ if (Math.abs(x - startX) > MOVE_TOL || Math.abs(y - startY) > MOVE_TOL){ cancelHold(); btn = null; } return; }
    if (ev && ev.cancelable) ev.preventDefault();
    lastX = x; moveTo(x);
  }
  document.addEventListener('touchstart', e => { const t = e.touches[0]; if (e.touches.length === 1) down(t.clientX, t.clientY, e.target); }, {passive:true});
  document.addEventListener('touchmove', e => { const t = e.touches[0]; move(t.clientX, t.clientY, e); }, {passive:false});
  document.addEventListener('touchend', finish); document.addEventListener('touchcancel', finish);
  document.addEventListener('mousedown', e => { if (e.button === 0) down(e.clientX, e.clientY, e.target); });
  document.addEventListener('mousemove', e => move(e.clientX, e.clientY, e));
  document.addEventListener('mouseup', finish);
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('#seg')) e.preventDefault(); });
  document.addEventListener('click', e => { if (justDragged && e.target.closest && e.target.closest('#seg')){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

/* ============ Efectivo ============ */
function renderCash(){
  const userRate = parseFloat(String(state.rate).replace(',', '.'));
  const rate = userRate > 0 ? userRate : 37, approx = !(userRate > 0);
  const toE = n => (approx ? '≈ ' : '') + fmtNum(Math.round(n / rate)) + ' €';
  const thb = n => fmtNum(Math.round(n)) + ' THB';
  const paidTHB = c => c.a != null ? c.a : c.eur * rate;
  const sumPaid = PAID.reduce((t, c) => t + paidTHB(c), 0);
  const sumTours = CASH.reduce((t, c) => t + c.a, 0);
  const pendTours = CASH.filter(c => !state.cash.has(c.id)).reduce((t, c) => t + c.a, 0);
  const dsum = DAILY.reduce((t, c) => t + c.a, 0), marg = Math.round(dsum * DAILY_MARGIN / 100) * 100, sumStay = dsum + marg;
  const cash = sumTours + sumStay, all = sumPaid + cash;
  const pct = n => (n / all * 100).toFixed(1) + '%';
  const C = {paid:'var(--jade)', tours:'var(--gold)', stay:'var(--blue)'};
  const amt = (n, eurTxt) => '<span style="margin-left:auto;text-align:right;white-space:nowrap"><b>' + thb(n) + '</b><br><small class="meta">' + (eurTxt || toE(n)) + '</small></span>';
  const line = (c, n, eurTxt) => '<div class="check" style="cursor:default"><span class="t"><b>' + c.l + '</b><span>' + c.d + '</span></span>' + amt(n, eurTxt) + '</div>';
  const tile = (col, ic, lab, n, sub, eurTxt) => '<div style="background:var(--surface);border:1px solid var(--line);border-top:5px solid ' + col + ';border-radius:14px;padding:10px 10px 12px;min-width:0"><div style="font-size:1.3rem">' + ic + '</div><small class="meta" style="display:block;line-height:1.2;margin:2px 0 4px">' + lab + '</small><b style="display:block;font-size:1.05rem;white-space:nowrap">' + fmtNum(Math.round(n)) + '</b><small class="meta" style="display:block">THB</small><small style="display:block;white-space:nowrap;font-weight:700;color:var(--muted)">' + (eurTxt || toE(n)) + '</small>' + (sub ? '<small style="display:block;margin-top:4px;color:var(--muted)">' + sub + '</small>' : '') + '</div>';

async function initSync(){
  if (!window.claude || !window.claude.use){ initDrive(); return; }
  let db = null, user = null;
  try { db = await window.claude.use('db'); } catch(e){}
  if (!db){ setSync('local'); return; }
  try { user = await window.claude.use('user'); SYNC.canWrite = user ? await user.can('data.write') : null; } catch(e){ SYNC.canWrite = null; }
  if (SYNC.canWrite === false) state.readOnly = true;
  SYNC.db = db;
  state.done = new Set(); state.prep = new Set(); state.cash = new Set(); state.plists = []; state.pitems = []; state.rate = ''; state.gastos = []; state.cashStart = ''; state.cashEur = ''; state.card = ''; state.cardCur = 'eur';
  SYNC.timer = setTimeout(() => { if (state.sync !== 'ok' && state.sync !== 'ro') setSync('slow'); }, 10000);
  setSync(state.readOnly ? 'ro' : 'connecting');
  listen(db); render();
}

}


/* ============ Dinero (gastos del día a día + presupuesto) ============ */
const D_OPEN = new Set((function(){ try { const v = store.get('folds', []); return Array.isArray(v) ? v : []; } catch(e){ return []; } })());
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.fold){ const k = d.dataset.fold; if (d.open){ D_OPEN.add(k); D_OPEN.delete('!' + k); } else { D_OPEN.delete(k); D_OPEN.add('!' + k); } store.set('folds', Array.from(D_OPEN)); } }, true);
const fold = (key, title, sub, body, defOpen) => { const open = D_OPEN.has(key) || (defOpen && !D_OPEN.has('!' + key)); return '<details class="fold" data-fold="' + key + '"' + (open ? ' open' : '') + '><summary>' + title + (sub ? ' <small>' + sub + '</small>' : '') + '</summary><div class="fbody">' + body + '</div></details>'; };
function keepScroll(fn){ const y = window.scrollY; fn(); window.scrollTo(0, y); }
function defaultDay(){ const tk = todayKey(); if (DAYS.some(d => d.key === tk)) return tk; return Date.now() < Date.parse('2026-11-27T00:00:00+07:00') ? DAYS[1].key : DAYS[DAYS.length - 2].key; }
const dayShort = k => { const d = DAYS.find(x => x.key === k); return d ? d.short + ' ' + d.num + (k.slice(5, 7) === '11' ? ' nov' : ' dic') : k; };
function openGForm(g){ state.gform = g ? {id:g.id, text:g.text || '', amt:String(g.amt), day:g.day, m:g.m || 'ef'} : {id:null, text:'', amt:'', day:defaultDay(), m:'ef'}; render(); setTimeout(() => { const a = $('#gfAmt'); if (a){ a.scrollIntoView({block:'center'}); a.focus(); } }, 30); }
function saveGForm(){
  const f = state.gform; if (!f) return;
  const amt = numOf(f.amt); if (!(amt > 0)){ toast('Escribe un importe mayor que 0.'); const a = $('#gfAmt'); if (a) a.focus(); return; }
  if (f.id){
    const g = state.gastos.find(x => x.id === f.id);
    if (g && canMutate()){ g.text = String(f.text || '').trim().slice(0, 80); g.amt = amt; g.day = f.day; g.m = f.m; persistLocal(); dset('gastos/' + g.id, {day: g.day, text: g.text, amt: g.amt, m: g.m, order: g.order}); }
  } else addGasto(f.day, f.text, amt, f.m);
  state.gform = {id:null, text:'', amt:'', day:f.id ? defaultDay() : f.day, m:f.m}; toast('Gasto guardado'); keepScroll(render);
}
document.addEventListener('input', e => { const t = e.target; if (!t || !state.gform) return; if (t.id === 'gfText') state.gform.text = t.value; else if (t.id === 'gfAmt') state.gform.amt = t.value; });
document.addEventListener('change', e => { const t = e.target; if (t && t.id === 'gfDay' && state.gform) state.gform.day = t.value; });
document.addEventListener('keydown', e => { const t = e.target; if (e.key === 'Enter' && t && (t.id === 'gfText' || t.id === 'gfAmt')){ e.preventDefault(); saveGForm(); } });
function renderDinero(){
  const rate = numOf(state.rate);
  const money = n => fmtNum(Math.round(n * 100) / 100) + ' ฿';
  const eurS = n => rate > 0 ? '<small class="meta" style="white-space:nowrap"> (' + fmtNum(Math.round(n / rate)) + ' €)</small>' : '';
  const start = cashTHB() || (numOf(state.cashEur) > 0 ? 0 : numOf(state.cashStart));
  const inp = 'width:120px;text-align:right;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);color:var(--ink)';
  let total = 0, cash = 0, card = 0;
  state.gastos.forEach(g => { total += g.amt; if (g.m === 'tj') card += g.amt; else cash += g.amt; });
  const left = start - cash;
  const configured = start > 0;
  const c = numOf(state.card);
  const red = v => v < 0 ? 'color:#c0392b' : '';
  const cashTile = '<div class="mtile"><small>💵 Efectivo</small>' + (configured
      ? '<span class="mv" style="' + red(left) + '">' + fmtNum(Math.round(left)) + ' ฿</span><span class="ms">' + (rate > 0 ? '≈ ' + fmtNum(Math.round(left / rate)) + ' €' : '&nbsp;') + '</span>'
      : '<span class="mv">—</span><span class="ms">Sin rellenar</span>') + '</div>';
  let cardTile = '<div class="mtile"><small>💳 Tarjeta</small>';
  if (!(c > 0)) cardTile += '<span class="mv">—</span><span class="ms">Sin rellenar</span>';
  else if (state.cardCur === 'thb'){ const l = c - card; cardTile += '<span class="mv" style="' + red(l) + '">' + fmtNum(Math.round(l)) + ' ฿</span><span class="ms">' + (rate > 0 ? '≈ ' + fmtNum(Math.round(l / rate)) + ' €' : '&nbsp;') + '</span>'; }
  else if (rate > 0){ const l = c - card / rate; cardTile += '<span class="mv" style="' + red(l) + '">' + fmtNum(Math.round(l * rate)) + ' ฿</span><span class="ms">≈ ' + fmtNum(Math.round(l)) + ' €</span>'; }
  else cardTile += '<span class="mv">' + fmtNum(c) + ' €</span><span class="ms">Falta el cambio</span>';
  cardTile += '</div>';
  if (!state.gform) state.gform = {id:null, text:'', amt:'', day:defaultDay(), m:'ef'};
  const f = state.gform;
  let h = '<h2 class="sec">Dinero</h2>';
  if (window.claude && window.claude.use) h += '<div class="warn">📱 Los gastos de esta página no se comparten con la app del móvil. Para apuntarlos usad la app: <a href="https://jlproyectos.github.io/Tailandia2026/" target="_blank" rel="noopener noreferrer">jlproyectos.github.io/Tailandia2026</a></div>';
  /* Resumen arriba */
  h += '<div class="box"><div class="pin" style="border:0;padding:14px">' +
    '<div class="mtiles">' + cashTile + cardTile + '</div>' +
    (configured ? '' : '<p class="meta" style="margin:8px 0 0">Rellenad abajo «Dinero con el que contáis»: euros que traéis, cambio y tarjeta.</p>') +
    '<div class="row" style="margin-top:10px"><span>Total gastado</span><b>' + money(total) + eurS(total) + '</b></div>' +
    '<div class="row"><span class="meta">En efectivo · con tarjeta</span><span class="meta">' + money(cash) + ' · ' + money(card) + '</span></div>' +
    '</div></div>';
  /* Formulario siempre visible */
  h += '<div class="gform"><b>' + (f.id ? '✎ Editar gasto' : '➕ Apuntar un gasto') + '</b>' +
    '<div class="g2"><input id="gfAmt" inputmode="decimal" placeholder="Importe ฿" value="' + esc(f.amt) + '" aria-label="Importe en baht"><select id="gfDay" aria-label="Día">' + DAYS.map(d => '<option value="' + d.key + '"' + (d.key === f.day ? ' selected' : '') + '>' + dayShort(d.key) + '</option>').join('') + '</select></div>' +
    '<input id="gfText" style="margin-top:8px" placeholder="Concepto (opcional)" maxlength="80" value="' + esc(f.text) + '" aria-label="Concepto">' +
    '<div class="seg2" style="margin-top:8px"><button data-gfm="ef" aria-pressed="' + (f.m !== 'tj') + '">💵 Efectivo</button><button data-gfm="tj" aria-pressed="' + (f.m === 'tj') + '">💳 Tarjeta</button></div>' +
    '<div class="g2">' + (f.id ? '<button class="btn" data-gfcancel>Cancelar</button><button class="btn pri" data-gfsave>Guardar cambios</button></div>' : '</div><button class="btn pri bigadd" style="margin-top:8px" data-gfsave>Guardar gasto</button>') + '</div>';
  /* Lista por días */
  const days = DAYS.filter(d => state.gastos.some(g => g.day === d.key)).reverse();
  if (!days.length) h += '<div class="empty">Todavía no habéis apuntado ningún gasto.</div>';
  days.forEach(d => {
    const gs = state.gastos.filter(g => g.day === d.key).sort((a, b) => (b.order || 0) - (a.order || 0));
    const sub = gs.reduce((t, g) => t + g.amt, 0);
    h += '<div class="box"><div class="row" style="padding:12px 14px"><b>' + esc(d.date) + '</b><b>' + money(sub) + '</b></div>' +
      gs.map(g => '<div class="grow"><span class="gt">' + (g.text ? esc(g.text) : '<span class="meta">Sin concepto</span>') + '<small>' + (g.m === 'tj' ? '💳 tarjeta' : '💵 efectivo') + '</small></span><b style="white-space:nowrap">' + money(g.amt) + '</b><button class="btn" data-gedit="' + g.id + '" aria-label="Editar gasto">✎</button><button class="btn" data-gdel="' + g.id + '" aria-label="Eliminar gasto">✕</button></div>').join('') + '</div>';
  });
  /* Ajustes de dinero */
  const ajustes =
    '<div class="row"><span>Euros que traemos de España</span><input id="geur" inputmode="decimal" placeholder="0 €" value="' + esc(state.cashEur) + '" aria-label="Euros que traemos" style="' + inp + '"></div>' +
    '<div class="row" style="margin-top:8px"><span>Cambio conseguido<br><small class="meta">THB por 1 €</small></span><input id="grate" inputmode="decimal" placeholder="37,0" value="' + esc(state.rate) + '" aria-label="Tipo de cambio en baht por euro" style="' + inp + '"></div>' +
    '<div class="row" style="margin-top:8px"><b>Efectivo en baht</b><b>' + (start > 0 ? money(start) : '—') + '</b></div>' +
    '<div class="row" style="margin-top:12px"><span>Dinero en la tarjeta</span><span style="display:flex;gap:6px;align-items:center"><input id="gcard" inputmode="decimal" placeholder="0" value="' + esc(state.card) + '" aria-label="Dinero en la tarjeta" style="' + inp + ';width:96px"><span class="seg2" style="width:auto">' + ['eur', 'thb'].map(k => '<button data-gcur="' + k + '" aria-pressed="' + (state.cardCur === k) + '" style="padding:8px 12px">' + (k === 'eur' ? '€' : '฿') + '</button>').join('') + '</span></span></div>' +
    '<p class="meta" style="margin:10px 0 0">Los gastos en efectivo restan del efectivo; los de tarjeta, del saldo de la tarjeta. El cambio se usa en toda la app para pasar a euros.</p>';
  h += fold('ajustes', '⚙️ Dinero con el que contáis', configured ? money(start) + ' en efectivo' : 'sin rellenar', ajustes, !configured);
  /* Presupuesto y cambio */
  const parts = renderCash().split('<!--CAMBIO-->');
  h += fold('presu', '📊 Presupuesto del viaje', 'pagado, pendiente y estimado', parts[0], false);
  if (parts[1]) h += fold('cambio', '💱 Cambiar dinero', 'Superrich, CN Money y cajeros', parts[1], false);
  $('#app').innerHTML = h;
}
function renderGastosTotalsOnly(){ const f = captureFocus(); const y = window.scrollY; render(); restoreFocus(f); window.scrollTo(0, y); }

/* ============ Render principal ============ */
function render(){
  renderSeg();
  const LEGACY = {gastos:'dinero', efectivo:'dinero', 'antes-de-volar':'prep', 'cosas-que-llevar':'prep', tiempo:'plan', resumen:'plan'};
  if (LEGACY[state.view]){ if (state.view === 'resumen') state.quick = true; state.view = LEGACY[state.view]; return render(); }
  if (!VIEWS[state.view]){ state.view = 'plan'; return render(); }
  if (state.view === 'plan') renderPlan();
  else if (state.view === 'reservas') renderRes();
  else if (state.view === 'dinero') renderDinero();
  else if (state.view === 'salud') renderSalud();
  else renderPrepAll();
  const conv = () => { const r = $('#rate') ? parseFloat(String($('#rate').value).replace(',', '.')) : numOf(state.rate), t = parseFloat(String($('#thb') && $('#thb').value).replace(',', '.')); const o = $('#thbOut'); if (o) o.textContent = (r > 0 && t >= 0) ? '= ' + (t / r).toLocaleString('es-ES', {maximumFractionDigits:2}) + ' €' : ''; };
  const rEl = $('#rate'), tEl = $('#thb');
  if (rEl) rEl.addEventListener('input', () => { setRate(rEl.value); conv(); });
  if (rEl) rEl.addEventListener('change', () => { const y = window.scrollY; render(); window.scrollTo(0, y); });
  if (tEl) tEl.addEventListener('input', conv);
  conv();
}

function go(view, day, noPush){
  state.view = view; if (typeof day === 'number') state.day = day;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
  if (!noPush){ try { location.hash = view === 'plan' ? 'd' + (state.day + 1) : view; } catch(e){} }
}
function fromHash(){
  let h = ''; try { h = location.hash.replace('#', ''); } catch(e){}
  const m = /^d(\d+)$/.exec(h);
  if (m && DAYS[+m[1] - 1]){ state.view = 'plan'; state.day = +m[1] - 1; return true; }
  const LG = {gastos:'dinero', efectivo:'dinero', 'antes-de-volar':'prep', 'cosas-que-llevar':'prep', resumen:'plan', tiempo:'plan'};
  if (LG[h]){ state.view = LG[h]; if (h === 'resumen') state.quick = true; return true; }
  if (VIEWS[h]){ state.view = h; return true; }
  return false;
}

/* ============ Eventos ============ */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-day],[data-toggle],[data-filter],[data-opt],[data-expand],[data-done],[data-copy],[data-step],[data-goto],[data-cash],[data-prep],[data-pchk],[data-pedit],[data-pdel],[data-psave],[data-pcancel],[data-ladd],[data-padd-btn],[data-lren],[data-ldel],[data-ltoggle],[data-seed],[data-seedantes],[data-icat],[data-kchk],[data-scroll],[data-undo],[data-gadd],[data-gcur],[data-gfopen],[data-gfsave],[data-gfcancel],[data-gfm],[data-quick],[data-gdel],[data-gedit]');
  if (!t) return;
  if (t.dataset.view){ go(t.dataset.view); return; }
  if (t.dataset.day){ state.day = +t.dataset.day; state.filter = 'todo'; state.quick = false; go('plan', state.day); window.scrollTo({top:0}); return; }
  if (t.dataset.toggle){
    const id = t.dataset.toggle, card = t.closest('.card, .box');
    const open = !card.classList.contains('open');
    card.classList.toggle('open', open); t.setAttribute('aria-expanded', open);
    if (open) state.open.add(id); else state.open.delete(id);
    return;
  }
  if (t.dataset.filter){ state.filter = t.dataset.filter; renderPlan(); return; }
  if (t.hasAttribute('data-opt')){ state.showOpt = !state.showOpt; renderPlan(); return; }
  if (t.hasAttribute('data-expand')){ state.expandAll = !state.expandAll; renderPlan(); return; }
  if (t.dataset.done){
    const id = t.dataset.done; setCheck('done', id, !state.done.has(id)); renderSeg(); renderPlan(); return;
  }
  if (t.dataset.copy){ copyText(t.dataset.copy); return; }
  if (t.dataset.step){ go('plan', Math.max(0, Math.min(DAYS.length - 1, state.day + (+t.dataset.step)))); return; }
  if (t.dataset.goto){ go(t.dataset.goto); return; }
  if (t.dataset.cash){ const id = t.dataset.cash; setCheck('cash', id, !state.cash.has(id)); keepScroll(render); return; }
  if (handleGastos(t)) return;
  if (handlePacking(t)) return;
  if (t.dataset.prep){ const id = t.dataset.prep; setCheck('prep', id, !state.prep.has(id)); keepScroll(render); return; }
});

$('#themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark' || (!root.getAttribute('data-theme') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  const next = dark ? 'light' : 'dark';
  root.setAttribute('data-theme', next); store.set('theme', next);
});
(function(){ const th = store.get('theme', ''); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); })();

window.addEventListener('hashchange', () => { if (fromHash()){ render(); window.scrollTo({top:0}); } });

/* ============ Arranque ============ */
(function init(){
  const tk = todayKey();
  const idx = DAYS.findIndex(d => d.key === tk);
  if (idx >= 0) state.day = idx;
  fromHash();
  renderWidgets(); setInterval(renderWidgets, 30000);
  loadLocal();
  render();
  initSync();
})();
</script>
</body>
